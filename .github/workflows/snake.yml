name: Generate Snake Animation

on:
  # Har 24 ghante baad khud-ba-khud run hoga
  schedule:
    - cron: "0 0 * * *"
  
  # Manual trigger karne ke liye
  workflow_dispatch:
  
  # Main branch par push hone par run hoga
  push:
    branches:
    - main

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # Snake SVG generate karne ke liye platane/snk action
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Generated file ko output branch par push karein
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
